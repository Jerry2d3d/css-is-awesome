# CDN publish workflow
#
# Purpose:
#   Runs after semantic-release publishes a GitHub Release (and, crucially, after
#   the sibling release pipeline has already `npm publish`ed the package). jsDelivr
#   auto-mirrors any npm tarball's file tree at:
#     https://cdn.jsdelivr.net/npm/css-is-awesome@<version>/<path>
#   so we don't publish to the CDN ourselves. Instead this workflow:
#     1. Smoke-checks that the expected files resolve on jsDelivr (best-effort).
#     2. Bundles dist/* + public/theme(s) into .tar.gz + .zip archives and
#        attaches them to the existing GitHub Release for direct download.
#     3. Appends a "CDN ready" section (with an HTML marker) to the Release body
#        so consumers have one-click copy-paste URLs.
#
# Env:
#   GITHUB_TOKEN  - auto-provided by Actions; used for Release asset upload and
#                   PATCHing the Release body.
#
# Dependency: the package `css-is-awesome` must already be live on npm when this
# fires. semantic-release in the sibling wave publishes to npm BEFORE creating the
# GitHub Release, so the `release: published` trigger is a safe point to query
# jsDelivr (with retries to absorb 1-3 min CDN lag).

name: CDN publish

on:
  # Called directly by Release once npm publish succeeds.
  #
  # The `release` trigger below has NEVER fired — zero runs, ever.
  # semantic-release creates the GitHub Release with GITHUB_TOKEN, and GitHub
  # does not start workflows from events raised by that token. So this job was
  # wired to an event that could not reach it from the day it was written.
  # Kept for a Release published by hand.
  workflow_call:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  cdn-artifacts:
    name: Bundle, upload, verify CDN
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name }}   # informational only; steps use steps.tag.outputs.tag
    steps:
      # Resolve the tag BEFORE checking anything out.
      #
      # On a `release` event the tag comes from the event. When Release calls
      # this workflow there is no event, so ask the API for the newest
      # release -- which semantic-release created moments earlier in the same
      # run. Checking out a blank ref would silently take the default branch
      # and package the wrong commit.
      - name: Resolve the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="$EVENT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::no release tag to attach archives to"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Attaching archives to $TAG"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all CSS bundles
        run: npm run build:css:all

      - name: Validate themes
        run: npm run validate-themes

      - name: Stage CDN bundle contents
        id: stage
        run: |
          set -euo pipefail
          STAGE="cdn-bundle"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/dist" "$STAGE/public"

          # Core CSS artifacts
          cp dist/css-is-awesome.css              "$STAGE/dist/"
          cp dist/css-is-awesome.min.css          "$STAGE/dist/"
          cp dist/css-is-awesome.core.min.css     "$STAGE/dist/"
          cp dist/css-is-awesome.utilities.min.css "$STAGE/dist/"

          # Default theme + six-theme catalog
          cp public/theme.css "$STAGE/public/theme.css"
          cp -R public/themes "$STAGE/public/themes"

          echo "Staged contents:"
          find "$STAGE" -type f | sort

          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Create tar.gz + zip archives
        id: archives
        run: |
          set -euo pipefail
          STAGE="${{ steps.stage.outputs.stage }}"
          BASENAME="css-is-awesome-${TAG}-cdn-bundle"

          tar -czf "${BASENAME}.tar.gz" -C "$STAGE" .
          ( cd "$STAGE" && zip -r "../${BASENAME}.zip" . )

          ls -lh "${BASENAME}.tar.gz" "${BASENAME}.zip"

          echo "tar=${BASENAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "zip=${BASENAME}.zip"    >> "$GITHUB_OUTPUT"

      # `gh release upload` instead of softprops/action-gh-release.
      #
      # This repo's Actions policy allows only GitHub-owned and
      # Marketplace-verified actions, and that action is neither, so it was
      # refused outright the first time this workflow ever ran:
      #
      #   The action softprops/action-gh-release@3bb1273 is not allowed in
      #   Jerry2d3d/css-is-awesome because all actions must be from a
      #   repository owned by Jerry2d3d, created by GitHub, or verified in
      #   the GitHub Marketplace.
      #
      # gh is pre-installed on every runner, needs no allowlist entry, and
      # removes a third-party dependency from the release path. --clobber so
      # a re-run replaces the assets rather than failing on a name collision.
      - name: Attach archives to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARBALL: ${{ steps.archives.outputs.tar }}
          ZIPFILE: ${{ steps.archives.outputs.zip }}
        run: |
          set -euo pipefail
          test -f "$TARBALL" || { echo "::error::missing $TARBALL"; exit 1; }
          test -f "$ZIPFILE" || { echo "::error::missing $ZIPFILE"; exit 1; }
          gh release upload "$TAG" "$TARBALL" "$ZIPFILE" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached $TARBALL and $ZIPFILE to $TAG"

      - name: Smoke-check jsDelivr endpoints (best-effort)
        id: smoke
        continue-on-error: true
        run: |
          set -uo pipefail

          # Canonical URLs consumers will paste into <link> tags.
          URLS=(
            "https://cdn.jsdelivr.net/npm/css-is-awesome@${TAG}/dist/css-is-awesome.min.css"
            "https://cdn.jsdelivr.net/npm/css-is-awesome@${TAG}/dist/css-is-awesome.core.min.css"
            "https://cdn.jsdelivr.net/npm/css-is-awesome@${TAG}/dist/css-is-awesome.utilities.min.css"
            "https://cdn.jsdelivr.net/npm/css-is-awesome@${TAG}/public/theme.css"
            "https://cdn.jsdelivr.net/npm/css-is-awesome@${TAG}/public/themes/press-light/theme.css"
          )

          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo "## jsDelivr smoke-check"
            echo ""
            echo "Tag: \`${TAG}\`"
            echo ""
            echo "| URL | Status |"
            echo "| --- | --- |"
          } >> "$SUMMARY"

          OVERALL_OK=1
          for url in "${URLS[@]}"; do
            OK=""
            for attempt in 1 2 3 4 5; do
              if curl -fsSL -o /dev/null "$url"; then
                OK="yes"
                echo "OK  ($attempt/5) $url"
                break
              fi
              echo "miss ($attempt/5) $url"
              sleep 30
            done
            if [ -n "$OK" ]; then
              echo "| \`$url\` | OK |" >> "$SUMMARY"
            else
              echo "| \`$url\` | MISSING (after 5 retries) |" >> "$SUMMARY"
              OVERALL_OK=0
            fi
          done

          if [ "$OVERALL_OK" -eq 0 ]; then
            echo "::warning::One or more jsDelivr URLs were not resolvable after retries. CDN propagation may still be catching up; check again in a few minutes."
          fi

      - name: Append "CDN ready" section to Release body (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          # `gh release` works by TAG, so nothing here needs the numeric
          # release id -- which is only available on a `release` event and is
          # empty when Release calls this workflow.
          CURRENT_BODY="$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body // ""')"

          if printf '%s' "$CURRENT_BODY" | grep -q '<!-- cdn-published -->'; then
            echo "CDN ready section already present; skipping append."
            exit 0
          fi

          # jsDelivr addresses npm PACKAGE VERSIONS, which carry no leading
          # `v`, while the git tag does. `@v1.22.0` is not a version npm
          # knows, so every URL below would have 404'd -- never noticed,
          # because this workflow had never run.
          VERSION="${TAG#v}"

          CDN_BLOCK=$(printf '%s\n' \
            '<!-- cdn-published -->' \
            '### CDN ready' \
            '' \
            'Via jsDelivr (cached globally, no auth):' \
            '' \
            "- \`https://cdn.jsdelivr.net/npm/css-is-awesome@${VERSION}/dist/css-is-awesome.min.css\`" \
            "- \`https://cdn.jsdelivr.net/npm/css-is-awesome@${VERSION}/public/theme.css\`" \
            "- \`https://cdn.jsdelivr.net/npm/css-is-awesome@${VERSION}/public/themes/<theme>/theme.css\`" \
            '' \
            'Or download the bundle attached to this release.')

          printf '%s\n\n%s' "$CURRENT_BODY" "$CDN_BLOCK" > release-notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.md
          echo "Appended the CDN section to $TAG"

          echo "Release body updated with CDN ready section."
