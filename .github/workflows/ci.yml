name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Next.js ESLint)
        run: npm run lint

      - name: Lint SCSS (stylelint)
        run: npm run lint:scss

      # validate-themes reads the COMMITTED CSS under public/, not the SCSS
      # sources — and theme building was not part of any CI step. So a fix
      # could land in scss/themes/*.scss, never be rebuilt, and this gate would
      # validate the stale output and report success. Same shape as every other
      # bug found here: a green check that proves nothing.
      #
      # This runs FIRST and does its own rebuild internally, comparing against
      # the committed artifacts and then restoring them. Do NOT add a
      # `build:css:themes` step before it — that would overwrite the committed
      # files and make it compare rebuilt-vs-rebuilt, which always passes.
      - name: Theme artifacts match their SCSS sources
        run: npm run check:theme-drift

      # Now safe: the artifacts below are proven to match their sources.
      - name: Validate themes
        run: npm run validate-themes

      - name: Validate icon pack
        run: npm run validate-icons

      # Guards the zero-emit promise of the `css-is-awesome/api` barrel. An
      # architectural invariant that isn't gated decays silently.
      - name: Validate /api barrel stays zero-emit
        run: npm run validate-api

      # Packs, installs into a temp dir, and compiles every import form the
      # docs tell consumers to write. validate-api only proves the barrel works
      # from INSIDE this repo — it stayed green while both README imports were
      # broken on a real install.
      - name: Validate the published package's documented imports
        run: npm run validate-package

      # Call-and-assert coverage. Every public mixin/function is invoked and
      # its output checked; every MCP tool is called over stdio. Both fail the
      # build below 98%, so adding API surface without a test is visible.
      - name: SCSS API coverage (>= 98%)
        run: npm run coverage:api

      - name: MCP tool coverage (>= 98%)
        run: npm run coverage:mcp

      - name: Build library CSS bundles
        run: npm run build:css:all

      # cia argues on size — the README, /compare and the homepage stat chip
      # all quote gzipped figures. Those numbers had drifted to be overstated
      # by up to 2x because nothing measured them. Now a bundle that outgrows
      # its budget fails here, and raising a budget is a deliberate edit.
      - name: Size budget (gzipped)
        run: npm run size-budget

      # Recipes are a v1.0 deliverable that nothing checked. This compiles
      # every SCSS block and asserts every cia.* symbol still exists, so a
      # mixin rename fails here rather than in a consumer's editor — a recipe
      # that teaches a call which no longer exists is worse than no recipe.
      - name: Validate recipes
        run: npm run validate-recipes

      - name: Build docs site (Next.js static export)
        run: npm run build

      - name: Upload docs site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: out/
          retention-days: 7

  playwright:
    name: Playwright (3 engines — smoke, a11y, platform, visual)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs in parallel with build-and-validate to keep total wall time low.
    # This job does its own `npm run build` because Playwright needs the
    # static export on disk to serve.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build docs site (Next.js static export)
        run: npm run build

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
