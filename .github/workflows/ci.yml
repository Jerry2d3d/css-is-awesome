name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Next.js ESLint)
        run: npm run lint

      - name: Lint SCSS (stylelint)
        run: npm run lint:scss

      - name: Validate themes
        run: npm run validate-themes

      - name: Build library CSS bundles
        run: npm run build:css:all

      - name: Build docs site (Next.js static export)
        run: npm run build

      - name: Upload docs site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: out/
          retention-days: 7

  playwright:
    name: Playwright (smoke + a11y + visual)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs in parallel with build-and-validate to keep total wall time low.
    # This job does its own `npm run build` because Playwright needs the
    # static export on disk to serve.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build docs site (Next.js static export)
        run: npm run build

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
