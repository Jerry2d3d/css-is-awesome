# Manual gate — promote main to prod-css-is-awesome.
#
# Trigger: ONLY runs when you click "Run workflow" in the Actions tab.
# Pushes to main do NOT auto-mirror to prod. This is the deploy button —
# click it when you're ready for cssisawesome.com to move.
#
# Hosting (since 2026-09-04): Vercel, with prod-css-is-awesome as the
# project's Production Branch. Vercel auto-builds and deploys as soon as
# this workflow pushes the branch — there is no further manual step.
# (Do NOT set NEXT_BASE_PATH on Vercel; that env is only for the GitHub
# Pages mirror, which serves under /css-is-awesome/.)
#
# By default the workflow mirrors origin/main. Pass a different ref or
# SHA via the input box if you want to ship from an earlier point.
#
# Conflict policy: public/flags.json is owned by the prod branch
# (prod-only flag flips like comingSoon and announcements live there,
# not on main). The .gitattributes file on prod-css-is-awesome maps
# that path to `merge=ours`; this workflow wires the corresponding
# merge driver before merging so the prod copy always wins.
#
# Other conflicts fail the workflow loudly — manual intervention is
# the right call there, since the prod branch isn't supposed to drift
# from main on anything except flags.json.

name: Promote to prod (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch, or tag to promote onto prod (default: main)"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: mirror-to-prod
  cancel-in-progress: false

jobs:
  promote:
    name: Merge into prod-css-is-awesome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout prod-css-is-awesome
        uses: actions/checkout@v4
        with:
          ref: prod-css-is-awesome
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Wire merge=ours driver (for public/flags.json)
        run: git config merge.ours.driver true

      - name: Resolve ref + show what's about to ship
        id: target
        run: |
          set -euo pipefail
          REF="${{ inputs.ref }}"
          git fetch origin "$REF" --tags
          # Prefer the remote ref shape (origin/<branch>); fall back to raw ref/SHA.
          if git rev-parse --verify --quiet "origin/$REF" >/dev/null; then
            TARGET="origin/$REF"
          else
            TARGET="$REF"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Promoting $TARGET onto prod-css-is-awesome:"
          echo "----"
          git log --oneline "HEAD..$TARGET" || true
          echo "----"

      - name: Merge
        run: |
          set -euo pipefail
          TARGET="${{ steps.target.outputs.target }}"
          if git merge-base --is-ancestor "$TARGET" HEAD; then
            echo "prod-css-is-awesome already contains $TARGET; nothing to promote."
            exit 0
          fi
          git merge --no-edit "$TARGET"

      - name: Push prod
        run: git push origin prod-css-is-awesome
