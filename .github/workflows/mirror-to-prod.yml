# Manual gate — promote main to prod-css-is-awesome.
#
# STATUS 2026-09-24: REVIVED. This is the deploy gate again.
#
# The release chain:
#
#     feature branch  →  main  →  qa  →  prod-css-is-awesome
#     (your work)        (CI)     (look   (public site + npm publish)
#                                  at it)
#
# `main` is integration and reaches nobody. "Promote to qa (manual)" stages
# it where Vercel builds a branch preview. THIS workflow then promotes `qa`
# to production, which updates the website and publishes the package.
#
# The default ref is `qa` so the chain is the path of least resistance. It
# still accepts any ref, which is the hotfix escape hatch — promoting
# something that skipped qa is possible, just never accidental.
#
# ONE SETTING MAKES THIS REAL: the Vercel project's Production Branch must
# be `prod-css-is-awesome`. Between 2026-09-04 and 2026-09-24 it was `main`,
# which is why the live site tracked every merge and this workflow changed
# nothing (verified: the site served 1.21.0 while prod sat at 1.11.1, fifteen
# versions behind, from 2026-09-09). If the site ever updates without this
# workflow having run, that setting has drifted back to `main`.
#
# NOTE: npm publishing is still tied to `main`, not `prod` — a merge to main
# publishes the package while the website waits for a promotion. Deliberate,
# and worth revisiting if the two should move together.
#
name: Promote to prod (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch, or tag to promote onto prod (default: qa)"
        required: false
        default: "qa"

permissions:
  contents: write

concurrency:
  group: mirror-to-prod
  cancel-in-progress: false

jobs:
  promote:
    name: Merge into prod-css-is-awesome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout prod-css-is-awesome
        uses: actions/checkout@v4
        with:
          ref: prod-css-is-awesome
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Wire merge=ours driver (for public/flags.json)
        run: git config merge.ours.driver true

      - name: Resolve ref + show what's about to ship
        id: target
        run: |
          set -euo pipefail
          REF="${{ inputs.ref }}"
          git fetch origin "$REF" --tags
          # Prefer the remote ref shape (origin/<branch>); fall back to raw ref/SHA.
          if git rev-parse --verify --quiet "origin/$REF" >/dev/null; then
            TARGET="origin/$REF"
          else
            TARGET="$REF"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Promoting $TARGET onto prod-css-is-awesome:"
          echo "----"
          git log --oneline "HEAD..$TARGET" || true
          echo "----"

      - name: Merge
        run: |
          set -euo pipefail
          TARGET="${{ steps.target.outputs.target }}"
          if git merge-base --is-ancestor "$TARGET" HEAD; then
            echo "prod-css-is-awesome already contains $TARGET; nothing to promote."
            exit 0
          fi
          git merge --no-edit "$TARGET"

      - name: Push prod
        run: git push origin prod-css-is-awesome
