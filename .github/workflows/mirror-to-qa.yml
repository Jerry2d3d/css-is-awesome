# Manual gate — promote main to qa.
#
# The release chain is:
#
#     feature branch  →  main  →  qa  →  prod-css-is-awesome
#     (your work)        (CI)     (look   (public site + npm publish)
#                                  at it)
#
# `main` is integration: merge freely, it reaches nobody. This workflow
# moves main onto `qa`, where Vercel builds a branch preview you can click
# through before anything is public. "Promote to prod (manual)" then moves
# `qa` onto the production branch, which is what updates the website and
# publishes the package.
#
# Trigger: ONLY when you click "Run workflow". Pushes to main do not
# auto-promote — that is the entire point of the gate.
#
# The default ref is `main`, so the normal path is one click. Pass a SHA or
# tag if you want to stage something other than the current tip.
#
# Conflict policy: public/flags.json is owned by the deployed branches
# (coming-soon and announcement flips live there, not on main), so the
# merge=ours driver is wired below and the branch copy always wins. Any
# other conflict fails the run loudly — qa is not supposed to diverge from
# main on anything else.
name: Promote to qa (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch, or tag to promote onto qa (default: main)"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: mirror-to-qa
  cancel-in-progress: false

jobs:
  promote:
    name: Merge into qa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qa
        uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Wire merge=ours driver (for public/flags.json)
        run: git config merge.ours.driver true

      - name: Resolve ref + show what's about to ship
        id: target
        run: |
          set -euo pipefail
          REF="${{ inputs.ref }}"
          git fetch origin "$REF" --tags
          if git rev-parse --verify --quiet "origin/$REF" >/dev/null; then
            TARGET="origin/$REF"
          else
            TARGET="$REF"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Promoting $TARGET onto qa:"
          echo "----"
          git log --oneline "HEAD..$TARGET" || true
          echo "----"

      - name: Merge
        run: |
          set -euo pipefail
          TARGET="${{ steps.target.outputs.target }}"
          if git merge-base --is-ancestor "$TARGET" HEAD; then
            echo "qa already contains $TARGET; nothing to promote."
            exit 0
          fi
          git merge --no-edit "$TARGET"

      - name: Push qa
        run: git push origin qa
