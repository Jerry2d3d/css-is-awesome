# GitHub Pages deploy — publishes the static-exported docs site to
# https://<user>.github.io/css-is-awesome/.
#
# Trigger: runs after the CI workflow succeeds on a push to `main`.
# CI must be green before we deploy (gated on workflow_run.conclusion).
#
# Repo setup (one-time):
#   Settings -> Pages -> Source: "GitHub Actions"
#
# Build flag: NEXT_BASE_PATH=/css-is-awesome ensures Next.js prefixes
# every internal href + asset URL so routes resolve under the repo
# subpath. For a custom domain, drop the env var and add a CNAME file
# to public/ (Next.js copies public/* into out/ automatically).

name: Mirror the site to GitHub Pages

# Builds the docs site from `prod-css-is-awesome` and publishes it to Pages.
#
# Run it after npm, so the version stamp on the home page (read from
# package.json) shows the release that just happened rather than the one
# before it.
#
# Normally runs as part of Release. Dispatchable on its own so a failure
# here is re-run without redoing the promotion.
on:
  # Called by Release (runs inside that run — no trigger involved), and
  # dispatchable on its own to re-run just this step after a failure.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only run if the Release workflow succeeded on main (it is itself gated
    # on CI success, and its run is "skipped" when CI failed). The upstream
    # event of a Release run is workflow_run, not push, so don't check it.
    # workflow_dispatch has no associated workflow_run, so allow it through.
    if: >-
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Pinned, not bare. A bare checkout takes the DEFAULT BRANCH, which
      # would mirror `main` to Pages while the public site served the
      # promoted branch - the two would disagree and nothing would say so.
      - name: Checkout the promoted branch
        uses: actions/checkout@v7
        with:
          ref: prod-css-is-awesome

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library CSS bundles
        run: npm run build:css:all

      - name: Build docs site (static export)
        env:
          NEXT_BASE_PATH: /css-is-awesome
        run: npm run build

      - name: Add .nojekyll
        # Stops GitHub Pages' Jekyll preprocessor from ignoring _next/.
        run: touch out/.nojekyll

      # Fails with "Get Pages site failed ... Not Found" until Pages is enabled
      # in repo Settings with Source = GitHub Actions. On a FREE plan that also
      # requires the repo to be public — Pages is not available for private
      # repos without a paid plan.
      #
      # Marked continue-on-error so an unconfigured Pages site does not paint
      # every CI run red and bury real failures. The deploy step below still
      # reports honestly: if this step is skipped, there is nothing to upload
      # and the job ends without claiming a deployment happened.
      - name: Configure Pages
        id: configure-pages
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Pages not configured — skipping deploy
        if: steps.configure-pages.outcome == 'failure'
        run: |
          echo "::notice::GitHub Pages is not enabled for this repository, so the docs site was not deployed."
          echo "::notice::Enable it at Settings -> Pages -> Source: GitHub Actions (requires a public repo on the free plan)."

      # Skipped when Pages is not configured — uploading a Pages artifact that
      # can never be deployed would be a green step that means nothing.
      - name: Upload Pages artifact
        if: steps.configure-pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
