# The deploy console. One workflow, one dropdown, the whole chain.
#
#     feature branch  ->  main  ->  qa  ->  prod-css-is-awesome
#     (your work)         (CI)      (look    (public site + npm publish)
#                                    at it)
#
# `main` is integration: merge into it freely, it reaches nobody. Promoting to
# `qa` gives Vercel a branch deployment you can click through. Promoting to
# `prod-css-is-awesome` updates the public website AND publishes the package
# to npm.
#
# Pick a stage from the dropdown when you click "Run workflow":
#
#   status  - change nothing, just print where every branch sits.
#   qa      - merge main into qa.
#   prod    - merge qa into prod-css-is-awesome. This one is public.
#
# Every run prints the chain state first, so you always see what you are
# about to ship before the merge happens. Tick `dry_run` to see the commit
# list without pushing anything.
#
# ONE SETTING MAKES THE PROD STAGE REAL: the Vercel project's Production
# Branch must be `prod-css-is-awesome`. Between 2026-09-04 and 2026-09-24 it
# was `main`, which is why the live site tracked every merge and promoting
# changed nothing. If the site ever moves without this workflow having run,
# that setting has drifted back to `main`.
#
# Conflict policy: `public/flags.json` is owned by the deployed branches, so
# `.gitattributes` marks it `merge=ours` and the driver is wired below - the
# branch being promoted INTO keeps its copy. Any other conflict fails the run
# loudly, because nothing else is supposed to diverge.
name: Promote

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage to run"
        required: true
        type: choice
        default: status
        options:
          - status
          - qa
          - prod
      ref:
        description: "Override the source (SHA, branch or tag). Blank = main for qa, qa for prod."
        required: false
        default: ""
      dry_run:
        description: "Show what would ship, but do not push"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # One promotion at a time, and never cancel one midway - a cancelled merge
  # can leave a branch pushed without its pair.
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history, all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Where everything sits right now
        run: |
          set -euo pipefail

          version_of() {
            git show "origin/$1:package.json" 2>/dev/null \
              | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
              | head -1
          }

          {
            echo "## Before"
            echo
            echo "| Branch | Version | Commit | Last change |"
            echo "|---|---|---|---|"
            for b in main qa prod-css-is-awesome; do
              if git rev-parse --verify --quiet "origin/$b" >/dev/null; then
                printf '| `%s` | %s | `%s` | %s |\n' \
                  "$b" "$(version_of "$b")" \
                  "$(git rev-parse --short "origin/$b")" \
                  "$(git log -1 --format=%cd --date=short "origin/$b")"
              else
                printf '| `%s` | - | _does not exist_ | - |\n' "$b"
              fi
            done
            echo
            echo "| Gap | Waiting to ship |"
            echo "|---|---|"
            echo "| main to qa | $(git rev-list --count origin/qa..origin/main) commit(s) |"
            echo "| qa to prod | $(git rev-list --count origin/prod-css-is-awesome..origin/qa) commit(s) |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          cat "$GITHUB_STEP_SUMMARY"

      - name: Work out the source and the destination
        if: inputs.stage != 'status'
        id: plan
        env:
          STAGE: ${{ inputs.stage }}
          REF_IN: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          case "$STAGE" in
            qa)   DEST=qa;                  DEFAULT_SRC=main ;;
            prod) DEST=prod-css-is-awesome; DEFAULT_SRC=qa   ;;
            *)    echo "::error::unknown stage '$STAGE'"; exit 1 ;;
          esac

          SRC_REF="$REF_IN"
          if [ -z "$SRC_REF" ]; then
            SRC_REF="$DEFAULT_SRC"
          fi

          git fetch origin "$SRC_REF" --tags || true
          # Prefer the remote branch shape; fall back to a raw SHA or tag.
          if git rev-parse --verify --quiet "origin/$SRC_REF" >/dev/null; then
            SRC="origin/$SRC_REF"
          elif git rev-parse --verify --quiet "$SRC_REF" >/dev/null; then
            SRC="$SRC_REF"
          else
            echo "::error::cannot resolve '$SRC_REF' to anything in this repo"
            exit 1
          fi

          {
            echo "dest=$DEST"
            echo "src=$SRC"
            echo "src_ref=$SRC_REF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Promoting \`$SRC_REF\` to \`$DEST\`"
            echo
            if git merge-base --is-ancestor "$SRC" "origin/$DEST"; then
              echo "\`$DEST\` already contains everything in \`$SRC_REF\`. Nothing to do."
            else
              echo "Commits this promotion carries:"
              echo
              echo '```'
              git log --oneline --no-decorate "origin/$DEST..$SRC"
              echo '```'
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge and push
        if: inputs.stage != 'status' && inputs.dry_run != true
        env:
          DEST: ${{ steps.plan.outputs.dest }}
          SRC: ${{ steps.plan.outputs.src }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pairs with the `public/flags.json merge=ours` line in .gitattributes.
          git config merge.ours.driver true

          git checkout -B "$DEST" "origin/$DEST"

          if git merge-base --is-ancestor "$SRC" HEAD; then
            echo "$DEST already contains $SRC; nothing to promote."
            exit 0
          fi

          git merge --no-edit "$SRC"
          git push origin "$DEST"

      - name: Dry run - stopping here
        if: inputs.stage != 'status' && inputs.dry_run == true
        run: |
          {
            echo "### Dry run - nothing was pushed"
            echo
            echo "Run it again with \`dry_run\` unticked to ship it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What happens next
        if: always()
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          {
            echo "## Next"
            echo
            case "$STAGE" in
              status)
                echo "Nothing changed. Run this again with **stage: qa** to stage main, or **stage: prod** to go public."
                ;;
              qa)
                echo "- CI is now running on \`qa\`."
                echo "- Vercel builds a deployment for the \`qa\` branch. It serves <https://qa.cssisawesome.com> once that domain is attached to the branch under the project's **Settings > Domains**."
                echo "- Click through it. When it looks right, run this workflow again with **stage: prod**."
                ;;
              prod)
                echo "- CI runs on \`prod-css-is-awesome\`, then **Release** publishes to npm, then **Pages** mirrors the site."
                echo "- The public website updates once Vercel finishes building the production branch."
                echo "- Watch the Actions tab. The npm version and the site version should end up in agreement."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
