# ============================================================================
# 1 · Release to qa
# ============================================================================
# Merges `main` into `qa` and stops. That is the whole job.
#
# Run it, then go and look at https://qa.cssisawesome.com. Nothing is waiting
# on you and nothing is held open.
#
# The release is five separate workflows, numbered so the Actions sidebar
# shows the order:
#
#   1 · Release to qa          <- you are here
#   2 · Release to production  (asks for approval)
#   3 · Publish to npm
#   4 · Mirror the site to GitHub Pages
#   5 · Attach CDN archives to the release
#
# Run them in order. Each one does one thing, so when something fails you
# re-run that one rather than the whole chain — which is the entire reason
# this is five files instead of one.
#
# See .github/RELEASE-PIPELINE.md for setup and the traps.
name: 1 · Release to qa

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Stage a specific branch, tag or SHA instead of main"
        required: false
        default: ""
      dry_run:
        description: "Do the merge, push nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Never cancel a promotion midway: a cancelled merge can leave a branch
  # pushed without its pair. Separate group from prod so staging qa is never
  # blocked by a production run waiting on an approval.
  group: release-qa
  cancel-in-progress: false

jobs:
  qa:
    name: Merge main into qa
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: qa
      url: https://qa.cssisawesome.com
    steps:
      - name: Checkout (full history, all branches)
        uses: actions/checkout@v7
        with:
          # NEVER shallow. Every count in the summary is a rev-list range, and
          # a shallow clone collapses them silently -- 21 commits once
          # reported as 1, with no error.
          fetch-depth: 0

      - name: Merge
        env:
          SRC_REF: ${{ inputs.ref || 'main' }}
          DEST: qa
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash .github/scripts/promote.sh

      - name: What now
        if: success() && inputs.dry_run != true
        run: |
          set -euo pipefail
          git fetch origin qa
          {
            echo "## Next"
            echo
            echo "\`qa\` is at \`$(git rev-parse --short origin/qa)\`."
            echo
            echo "- Vercel is building the \`qa\` branch, served at <https://qa.cssisawesome.com>."
            echo "  A Vercel login page there is deployment protection working, not a broken build."
            echo "- **Test it.** This run is finished; nothing is waiting on you."
            echo
            echo "When you are happy, run **2 · Release to production**. That one asks for"
            echo "your approval before it touches anything public."
          } >> "$GITHUB_STEP_SUMMARY"
