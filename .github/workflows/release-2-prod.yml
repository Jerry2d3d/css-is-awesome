# ============================================================================
# 2 · Release to production
# ============================================================================
# Merges `qa` into `prod-css-is-awesome`, after you approve it.
#
# The approval is the gate. This job declares the `Production` environment,
# which carries a required-reviewer rule, so GitHub holds the job BEFORE its
# first step and shows a `Review deployments` button on the run page. Nothing
# public moves until you press it.
#
# It promotes whatever is on `qa` right now. Run **1 · Release to qa** first
# and test it; this workflow does not stage anything itself.
#
# Publishing is NOT part of this. Run **3 · Publish to npm** after.
#
# See .github/RELEASE-PIPELINE.md for setup and the traps.
name: 2 · Release to production

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do the merge, push nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # A run parked on the approval gate holds this group, so a second
  # production release cannot start behind it. That is deliberate -- two
  # promotions racing is worse than a queue -- but it is also why a run that
  # looks stuck as "pending" is usually an older one still waiting on Review
  # deployments.
  group: release-prod
  cancel-in-progress: false

jobs:
  # A separate job with NO environment, so it runs BEFORE the approval gate.
  # An environment's reviewer rule blocks a job ahead of its first step, so a
  # check written inside `prod` would run after you had already approved --
  # which would make the approval a formality.
  show:
    name: What is about to ship
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (full history, all branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Print it
        run: |
          set -euo pipefail

          version_of() {
            git show "origin/$1:package.json" \
              | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
              | head -1
          }

          {
            echo "## About to ship"
            echo
            echo "| Branch | Commit | Version |"
            echo "|---|---|---|"
            printf '| `qa` (the source) | `%s` | %s |\n' \
              "$(git rev-parse --short origin/qa)" "$(version_of qa)"
            printf '| `prod-css-is-awesome` (now) | `%s` | %s |\n' \
              "$(git rev-parse --short origin/prod-css-is-awesome)" "$(version_of prod-css-is-awesome)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Merge nodes are excluded from every count: promoting into a branch
          # creates one ON that branch every time, so counting them reports
          # ordinary history as a difference.
          COUNT=$(git rev-list --count --no-merges origin/prod-css-is-awesome..origin/qa)

          if [ "$COUNT" -eq 0 ]; then
            {
              echo "### Nothing new to promote"
              echo
              echo "\`prod-css-is-awesome\` already contains everything on \`qa\`, so the merge"
              echo "below will be a no-op. **That is not an error and the run continues** --"
              echo "being current on the branch is not the same as being released. npm, Pages"
              echo "and the CDN archives are separate workflows and may still be behind."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### The $COUNT commit(s) this ships"
              echo
              echo '```'
              git log --oneline --no-decorate --no-merges origin/prod-css-is-awesome..origin/qa
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Work on main that this release does NOT carry. Not an error --
          # shipping only what was tested is the point -- but it has to be
          # said, because the assumption when releasing is "I get the latest".
          AHEAD=$(git rev-list --count --no-merges origin/qa..origin/main)
          if [ "$AHEAD" -gt 0 ]; then
            {
              echo "### NOT in this release: $AHEAD commit(s) on main"
              echo
              echo "These landed on \`main\` after \`qa\` was staged. To include them, cancel,"
              echo "run **1 · Release to qa** again, test, and come back."
              echo
              echo '```'
              git log --oneline --no-decorate --no-merges origin/qa..origin/main
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Commits on qa that main has never seen -- someone staged a branch
          # with `ref` to look at it. Worth flagging loudly; not worth
          # blocking, because blocking here is how the pipeline deadlocked.
          UNMERGED=$(git rev-list --count --no-merges origin/main..origin/qa)
          if [ "$UNMERGED" -gt 0 ]; then
            {
              echo "### ⚠ qa holds $UNMERGED commit(s) that are not on main"
              echo
              echo "Usually that means a feature branch was staged with \`ref\` to look at it."
              echo "**Do not approve** unless shipping it is the point -- and if it is, merge"
              echo "the same work to \`main\` too, or the next ordinary release reverts it."
              echo
              echo '```'
              git log --oneline --no-decorate --no-merges origin/main..origin/qa
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          cat "$GITHUB_STEP_SUMMARY"

  prod:
    name: Merge qa into prod-css-is-awesome
    needs: show
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      # Capital P: Vercel's GitHub integration created this environment, and
      # GitHub matches names case-insensitively, so asking for `production`
      # binds to the same box rather than making a second one.
      #
      # The required-reviewer rule lives here and gates THIS job. Vercel
      # creates its deployments through the API, which does not pass through
      # Actions protection rules, so Vercel's behaviour is unaffected.
      name: Production
      url: https://cssisawesome.com
    steps:
      - name: Checkout (full history, all branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge
        env:
          SRC_REF: qa
          DEST: prod-css-is-awesome
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash .github/scripts/promote.sh

      - name: What now
        if: success() && inputs.dry_run != true
        run: |
          {
            echo "## Next"
            echo
            echo "Production is updated. Vercel rebuilds the production branch now."
            echo
            echo "**The release is not finished.** Run these three, in order:"
            echo
            echo "1. **3 · Publish to npm**"
            echo "2. **4 · Mirror the site to GitHub Pages**"
            echo "3. **5 · Attach CDN archives to the release**"
            echo
            echo "They are separate workflows on purpose: each can be re-run on its own"
            echo "when it fails, without redoing the promotion."
          } >> "$GITHUB_STEP_SUMMARY"
