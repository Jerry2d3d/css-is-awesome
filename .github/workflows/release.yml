# Release pipeline — publishes css-is-awesome to npm and creates a GitHub Release.
#
# Trigger: runs after the CI workflow succeeds on a push to `main`. CI must be
# green before release-lane runs (we gate on workflow_run.conclusion below).
#
# Secrets required (configure under repo Settings -> Secrets and variables -> Actions):
#   NPM_TOKEN     — an npm automation token with publish rights on the
#                   `css-is-awesome` package. Add before the first release.
#   GITHUB_TOKEN  — provided automatically by GitHub Actions; semantic-release
#                   uses it to cut the GitHub Release and push the CHANGELOG /
#                   package.json bump commit back to main.
#
# Do not run this locally — semantic-release is configured to publish on green CI only.
#
# IF THIS JOB FAILS AT THE PUBLISH STEP, READ THIS FIRST.
#
# semantic-release runs `prepare` BEFORE `publish`. @semantic-release/git lives
# in `prepare`, so by the time npm is contacted it has ALREADY written the
# CHANGELOG, bumped package.json, committed `chore(release): X.Y.Z [skip ci]`
# and pushed the tag. A publish failure therefore leaves the repo asserting a
# version that exists nowhere — no npm package, no GitHub release — and every
# retry burns another number (we lost v1.1.0 and v1.1.1 to this on 2026-08-30).
#
# Recovery: confirm the version is genuinely unpublished
#   npm view css-is-awesome@X.Y.Z version      # expect E404
# then delete the tag locally and on the remote before retrying:
#   git tag -d vX.Y.Z && git push origin :refs/tags/vX.Y.Z
# Otherwise the next run computes a patch bump on top of a release that never
# shipped.
#
# Also: `gh run rerun` re-runs the job against its ORIGINAL commit. If main has
# moved since (and it will have, because `prepare` already pushed), the rerun
# exits with "The local branch main is behind the remote one, therefore a new
# version won't be published" and reports SUCCESS having done nothing. Push a
# fresh commit to trigger CI instead of re-running.
#
# npm auth notes, in the order they bit us:
#   EINVALIDNPMTOKEN — NPM_TOKEN missing or malformed.
#   EOTP            — the token authenticates but npm wants a 2FA code, which
#                     CI cannot supply. Fix on the npm ACCOUNT: set two-factor
#                     to "Authorization only", or use a Classic *Automation*
#                     token, which bypasses 2FA by design.
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run if CI succeeded on a push event to main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build library CSS bundles
        run: npm run build:css:all

      - name: Validate themes
        run: npm run validate-themes

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
