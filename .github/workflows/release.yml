# The release. One run, one button.
#
# SETUP GUIDE AND TRAPS: .github/RELEASE-PIPELINE.md — how to stand this up
# in another repo, and the failures that shaped it. Read the traps before
# changing anything here; most of them look like reasonable edits.
#
#     feature branch  ->  main  ->  qa  ->  prod-css-is-awesome
#     (your work)         (CI)     (test   (public site + npm publish)
#                                   it)
#
# HOW YOU USE IT
#
#   1. Actions -> Release -> Run workflow. Nothing to pick. Just run it.
#   2. It deploys qa and then STOPS, holding the run open.
#   3. Test qa. An hour, a day, a week — the run waits.
#   4. Come back to that same run and press `Review deployments` -> Approve.
#   5. The same run promotes to production and publishes to npm.
#
# That is the whole thing. One run from start to finish, and one button in
# the middle where you decide.
#
# Changed your mind at step 3? Cancel the run. qa keeps what was staged and
# production is untouched — which is also how you do a qa-only deploy.
#
# WHY THERE IS NO STAGE DROPDOWN (removed 2026-09-30)
#
# There used to be one: status / qa / prod. It was required, it defaulted to
# `status`, and `status` is defined as "change nothing" — so the default
# click did nothing at all, three times in a row, while reporting success.
#
# It also meant a release took two runs: one to stage qa, another to promote.
# You cannot advance a stage by re-running, because a re-run reuses the
# original inputs, so the natural "Re-run all jobs" button on the run page
# could never do it either. Every part of that was friction pretending to be
# safety.
#
# The approval gate on the Production environment was always the real
# control. Now it is the ONLY control, and it lives where you are already
# looking: on the run.
#
# WHAT MAKES THE APPROVAL MEAN SOMETHING
#
# The qa job publishes the exact commit it staged as a job output, and prod
# promotes THAT SHA rather than re-reading the branch:
#
#     SRC_REF: ${{ needs.qa.outputs.sha }}
#
# Without the pin, prod would resolve `qa` at approval time — hours after you
# looked at it — so anything merged to main while you tested would ride along
# unseen. A SHA cannot drift. What you approved is what ships.
#
# `ref` stages something other than main, which is a good way to put a
# feature branch on a real deployment. `verify` then REFUSES to promote,
# because a branch staged to be looked at must never be one click from npm.
# Tick `allow_unmerged` when shipping it is the whole point, as with a
# hotfix.
#
# WHY THERE IS A JOB PER STAGE
# ----------------------------
# A job can declare only one `environment:`, and the environment is what makes
# this a pipeline rather than a form. Each one gets its own box on the repo's
# /deployments page, its own history of what shipped when, and its own
# protection rules - which is how `prod` can require an approval before it
# runs at all. A single job handling every stage could have none of that.
#
# The merge itself lives in .github/scripts/promote.sh so the two stages share
# ONE implementation. Two copies of a merge would be two things to keep in
# step, and the copy used less often is the one that rots.
#
# ADDING A `dev` STAGE LATER
# --------------------------
# Three edits, no restructuring: add `dev` to the `options` list below, copy
# the `qa` job with SRC_REF/DEST changed, and create the matching environment.
# The script needs no change at all - it already takes any pair of branches.
#
# ONE SETTING MAKES THE PROD STAGE REAL: the Vercel project's Production
# Branch must be `prod-css-is-awesome`. Between 2026-09-04 and 2026-09-24 it
# was `main`, which is why the live site tracked every merge and releasing
# changed nothing. If the site ever moves without this workflow having run,
# that setting has drifted back to `main`.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "qa stage only — stage a specific SHA, branch or tag instead of main. Ignored by prod, which always takes qa."
        required: false
        default: ""
      allow_unmerged:
        description: "prod stage only — promote even though qa holds commits that are not on main (a hotfix staged with ref). Off by default, so a branch staged for testing cannot reach npm."
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Show what would ship, but do not push"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # One release at a time, and never cancel one midway - a cancelled merge can
  # leave a branch pushed without its pair.
  #
  # KNOWN CONSEQUENCE: a production job sitting on its approval gate still
  # holds this group, so a run left un-approved BLOCKS every later release
  # until someone approves or cancels it. That is the correct trade (two
  # promotions racing each other is worse than a queue), but if a release
  # seems stuck as "pending" and never starts, look for an older run waiting
  # on Review deployments before looking anywhere else.
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Always runs. Prints the chain before anything moves, so "what am I about to
  # ship" is answered on the run page rather than from memory.
  # ---------------------------------------------------------------------------
  state:
    name: Where everything sits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (full history, all branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Print the chain
        run: |
          set -euo pipefail

          version_of() {
            git show "origin/$1:package.json" 2>/dev/null \
              | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
              | head -1
          }

          {
            echo "## Before"
            echo
            echo "| Branch | Version | Commit | Last change |"
            echo "|---|---|---|---|"
            for b in main qa prod-css-is-awesome; do
              if git rev-parse --verify --quiet "origin/$b" >/dev/null; then
                printf '| `%s` | %s | `%s` | %s |\n' \
                  "$b" "$(version_of "$b")" \
                  "$(git rev-parse --short "origin/$b")" \
                  "$(git log -1 --format=%cd --date=short "origin/$b")"
              else
                printf '| `%s` | - | _does not exist_ | - |\n' "$b"
              fi
            done
            echo
            echo "| Gap | Waiting to ship |"
            echo "|---|---|"
            echo "| main to qa | $(git rev-list --count --no-merges origin/qa..origin/main) commit(s) |"
            echo "| qa to prod | $(git rev-list --count --no-merges origin/prod-css-is-awesome..origin/qa) commit(s) |"
            echo

            # Why prod looks like it has been written to directly, when it has not.
            PROD_ONLY_ALL=$(git rev-list --count origin/main..origin/prod-css-is-awesome)
            PROD_ONLY_REAL=$(git rev-list --count --no-merges origin/main..origin/prod-css-is-awesome)
            echo "<details><summary>Why <code>prod-css-is-awesome</code> shows $PROD_ONLY_ALL commits ahead of main</summary>"
            echo
            echo "$PROD_ONLY_ALL commits on prod are not on main. $PROD_ONLY_REAL of them contain anything:"
            echo
            echo '```'
            git log --no-merges --format='%h %ad %s' --date=short origin/main..origin/prod-css-is-awesome
            echo '```'
            echo
            echo "The rest are merge nodes. Promoting main into prod creates a commit **on prod**"
            echo "that main never sees, so this number grows by one per release and never falls."
            echo "It is not evidence of anything being pushed straight to production."
            echo
            echo "The real ones should only ever be \`public/flags.json\` (the coming-soon and"
            echo "announcement switches, which the deployed branch owns via \`.gitattributes\`)"
            echo "and \`.gitattributes\` itself. Anything else in that list is worth a look:"
            echo
            echo '```'
            git log --no-merges --name-only --format='%h %s' origin/main..origin/prod-css-is-awesome | head -40
            echo '```'
            echo "</details>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          cat "$GITHUB_STEP_SUMMARY"


  # ---------------------------------------------------------------------------
  # qa - staging. Runs for the `qa` stage and nothing else. No approval gate,
  # because not needing one is the point of a staging branch: put something
  # there, look at it, put something else there.
  # ---------------------------------------------------------------------------
  qa:
    name: Release to qa
    needs: state
    # No condition. Every run stages qa, then the run parks on production's
    # approval gate. One run carries the whole release and you come back to
    # it -- there is no second run and nothing to pick up front.
    outputs:
      # The exact commit qa ended up at, pinned for the prod job.
      #
      # This is the entire fix for the bug that made me split these jobs
      # apart. prod used to take `qa` as a branch name and resolve it when the
      # approval came through -- which could be hours later, after main had
      # moved and someone had staged again. You approved one thing and shipped
      # another.
      #
      # Promoting a SHA removes the window completely: the commit this job
      # created is the commit prod pushes, no matter what happens to the
      # branch while the run waits.
      sha: ${{ steps.staged.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: qa
      url: https://qa.cssisawesome.com
    steps:
      - name: Checkout (full history, all branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge main into qa
        env:
          SRC_REF: ${{ inputs.ref || 'main' }}
          DEST: qa
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash .github/scripts/promote.sh

      # Read it back from the remote rather than from the local checkout.
      # promote.sh exits early without pushing when qa already contains the
      # source, and on a dry run it resets the local branch -- in both cases
      # the local HEAD is not what qa is. The remote always is.
      - name: Pin the staged commit
        id: staged
        run: |
          set -euo pipefail
          git fetch origin qa
          SHA=$(git rev-parse origin/qa)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "qa is at $SHA"

      - name: What happens next
        if: success() && inputs.dry_run != true
        env:
          SHA: ${{ steps.staged.outputs.sha }}
        run: |
          {
            echo "## Next"
            echo
            echo "- CI is now running on \`qa\`."
            echo "- Vercel builds a deployment for the \`qa\` branch, served at <https://qa.cssisawesome.com>. Preview deployments sit behind Vercel's login unless deployment protection is turned off, so a login page there is the protection working, not a broken build."
            echo
            echo "### This run is now waiting for you"
            echo
            echo "**Scroll up on this page. There is a \`Review deployments\` button.** That is the"
            echo "whole release control -- one button, on this run, whenever you are ready."
            echo
            echo "- **Test qa now.** Take as long as you like: an hour, a day, a week. The run"
            echo "  sits here and nothing reaches the public site or npm until you press it."
            echo "- **Press Approve** and this same run promotes to production and publishes to npm."
            echo "- **Changed your mind?** Cancel the run. qa keeps what was staged; production is"
            echo "  untouched."
            echo
            echo "It will ship **this exact commit**, \`$SHA\`, pinned when this step ran."
            echo "Anything merged to main while you test cannot change what you approved."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # verify - what exactly is about to go public, printed BEFORE the approval.
  #
  # This job exists because of where GitHub puts the approval gate. An
  # environment's reviewer rule blocks a job before its FIRST step, so any
  # check written inside the prod job would run after the approval, not before
  # it, and approving would mean approving on trust. A separate job with no
  # environment runs first, which puts the commit list on the run page while
  # the `Review deployments` prompt is still sitting there unanswered.
  #
  # It is also the safety gate. `ref` lets a feature branch be staged to qa,
  # which is a good way to look at something and a terrible thing to be one
  # click away from npm. So if qa holds commits that are not on main, this
  # fails and names them, unless `allow_unmerged` says that was deliberate.
  # ---------------------------------------------------------------------------
  verify:
    name: What is about to ship
    needs: [state, qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (full history, all branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show what qa holds, and refuse if it did not come from main
        env:
          ALLOW_UNMERGED: ${{ inputs.allow_unmerged }}
          # The commit the qa job just staged. Everything below reports on
          # THIS, so the summary you read on the run page is the summary of
          # the thing the approval will ship.
          STAGED: ${{ needs.qa.outputs.sha }}
        run: |
          set -euo pipefail

          version_of() {
            git show "origin/$1:package.json" \
              | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
              | head -1
          }

          QA=$(git rev-parse --short "$STAGED")
          PROD=$(git rev-parse --short origin/prod-css-is-awesome)

          # Commits on qa that main has never seen. Merge nodes are excluded on
          # purpose: promoting main into qa creates one ON qa every time, so
          # counting them would report ordinary history as a problem. Only real
          # commits can represent work that bypassed main.
          mapfile -t UNMERGED < <(git log --no-merges --format='%h %s' origin/main.."$STAGED")

          {
            echo "## About to ship"
            echo
            echo "| Branch | Commit | Version |"
            echo "|---|---|---|"
            printf '| `qa` (the source) | `%s` | %s |\n' "$QA" \
              "$(git show "$STAGED:package.json" | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"
            printf '| `prod-css-is-awesome` (now) | `%s` | %s |\n' "$PROD" "$(version_of prod-css-is-awesome)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if git merge-base --is-ancestor "$STAGED" origin/prod-css-is-awesome; then
            {
              echo "### Nothing to ship"
              echo
              echo "\`prod-css-is-awesome\` already contains everything on \`qa\`."
              echo "Run **stage: qa** first to stage something, test it, then come back."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::qa holds nothing that prod does not already have"
            exit 1
          fi

          {
            echo "### The $(git rev-list --count --no-merges origin/prod-css-is-awesome..$STAGED) commit(s) this ships"
            echo
            echo '```'
            git log --oneline --no-decorate --no-merges origin/prod-css-is-awesome.."$STAGED"
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Work sitting on main that this release does NOT carry. Not an
          # error - shipping only what was tested is the entire design - but it
          # has to be said out loud, because the natural assumption when
          # clicking "release to production" is that it ships the latest.
          AHEAD=$(git rev-list --count --no-merges "$STAGED"..origin/main)
          if [ "$AHEAD" -gt 0 ]; then
            {
              echo "### NOT in this release: $AHEAD commit(s) on main"
              echo
              echo "These landed on \`main\` after \`qa\` was staged, so they are not part of"
              echo "this promotion and will not reach npm. That is deliberate - this run ships"
              echo "the commit that was tested. To include them: cancel, run **stage: qa**"
              echo "again, test, then release."
              echo
              echo '```'
              git log --oneline --no-decorate --no-merges "$STAGED"..origin/main
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ ${#UNMERGED[@]} -gt 0 ]; then
            if [ "$ALLOW_UNMERGED" = "true" ]; then
              {
                echo "### Promoting unmerged work, as requested"
                echo
                echo "\`qa\` holds ${#UNMERGED[@]} commit(s) that are not on \`main\`, and"
                echo "\`allow_unmerged\` is ticked, so this is going ahead."
                echo
                echo "**Merge the equivalent into \`main\` as well.** Otherwise the next ordinary"
                echo "release promotes a main that lacks it and quietly reverts it in production."
                echo
                echo '```'
                printf '%s\n' "${UNMERGED[@]}"
                echo '```'
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "### Refusing: qa holds work that is not on main"
                echo
                echo "These commits are on \`qa\` but not on \`main\`:"
                echo
                echo '```'
                printf '%s\n' "${UNMERGED[@]}"
                echo '```'
                echo
                echo "That usually means a branch was staged with \`ref\` in order to look at it,"
                echo "and looking at something must not put it one approval away from npm."
                echo "Nothing was promoted."
                echo
                echo "- **If it was only for testing:** run **stage: qa** with \`ref: main\` to put"
                echo "  qa back where it belongs, then release."
                echo "- **If shipping it is the point** (a hotfix): run this again with"
                echo "  \`allow_unmerged\` ticked, and merge the same work into \`main\`."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::qa holds ${#UNMERGED[@]} commit(s) not on main; tick allow_unmerged if that is intended"
              exit 1
            fi
          fi

          cat "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # prod - public site AND npm. The `production` environment carries the
  # required-reviewer rule, so this job WAITS for an approval before its first
  # step runs. That approval is the real gate; the dropdown is only the request.
  # ---------------------------------------------------------------------------
  prod:
    name: Release to production
    # `needs: verify` is load-bearing, not ordering sugar. Production takes
    # whatever is on `qa` without inspecting it, so `verify` is the only thing
    # standing between "qa holds a branch someone was looking at" and "that
    # branch is on npm". It also has to be a SEPARATE job, so its output
    # reaches the run page before the approval prompt rather than after it.
    needs: [state, qa, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      # `Production` with a capital P, because that environment already
      # existed: Vercel's GitHub integration created it, and GitHub matches
      # environment names case-insensitively, so asking for `production`
      # binds to the same one rather than making a second box. That turns out
      # to be the better outcome - one production box carrying both the
      # promotion and the deployment it causes.
      #
      # The required-reviewer rule lives on that environment and gates THIS
      # job only. Vercel creates its deployments through the API, which does
      # not pass through Actions protection rules, so nothing about Vercel's
      # behaviour changed.
      name: Production
      url: https://cssisawesome.com
    steps:
      - name: Checkout (full history, all branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge qa into prod-css-is-awesome
        env:
          # The SHA the qa job staged in THIS run, not the branch name.
          #
          # `ref` is still not read here: an override would be a way to put
          # something into production that never passed through qa, which is
          # the one thing this chain exists to prevent. But a branch name was
          # not safe either -- it resolves when the approval arrives, which
          # can be hours after you looked at it, so main moving in the
          # meantime changed what you were approving.
          #
          # A SHA cannot drift. What the qa step pushed is what this promotes.
          SRC_REF: ${{ needs.qa.outputs.sha }}
          DEST: prod-css-is-awesome
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash .github/scripts/promote.sh

      - name: What happens next
        if: success() && inputs.dry_run != true
        run: |
          {
            echo "## Next"
            echo
            echo "- CI runs on \`prod-css-is-awesome\`, then **Publish to npm** releases the package, then **Pages** mirrors the site."
            echo "- The public website updates once Vercel finishes building the production branch."
            echo "- Watch the Actions tab. The npm version and the site version should end up in agreement."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Publishing is part of the release, not a consequence of it.
  #
  # It used to hang off CI running on prod-css-is-awesome. That can never
  # happen: the prod job pushes with the default GITHUB_TOKEN, and GitHub
  # does not trigger workflows from such pushes. So the promotion succeeded,
  # the website updated, and npm quietly stayed where it was.
  #
  # Calling the publish workflow directly removes the dependency on a trigger
  # that cannot fire. The approval on the prod job above is what gates it.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm
    needs: prod
    if: inputs.dry_run != true && needs.prod.result == 'success'
    uses: ./.github/workflows/publish-npm.yml
    # MUST be listed here, and this is why the whole workflow refused to start.
    #
    # A `permissions:` block REPLACES the default set rather than adding to
    # it, so the workflow-level `contents: write` above left every other
    # scope at none. publish-npm.yml's job asks for issues, pull-requests and
    # id-token, which is an escalation, and a called workflow can only ever
    # narrow what the caller was granted. GitHub rejects that before any job
    # runs — the whole Release run failed at startup, including the `status`
    # stage that touches nothing.
    #
    # Worth knowing: it failed on the FIRST run after the publish job was
    # added, and it failed for every stage, not just prod. A reusable
    # workflow reference is validated when the run starts, not when the job
    # that uses it would execute.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    secrets: inherit
